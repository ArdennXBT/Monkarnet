<svg width="520" height="400" viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eq-header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF3EE"/>
      <stop offset="100%" stop-color="#DCEEE3"/>
    </linearGradient>
    <linearGradient id="eq-add-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#128264"/>
      <stop offset="100%" stop-color="#0C5A44"/>
    </linearGradient>
    <linearGradient id="eq-avatar-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#159270"/>
      <stop offset="100%" stop-color="#0C5A44"/>
    </linearGradient>
    <linearGradient id="eq-avatar-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A73F5"/>
      <stop offset="100%" stop-color="#2246C9"/>
    </linearGradient>
    <filter id="eq-card-shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1A18" flood-opacity="0.06"/>
    </filter>
    <filter id="eq-btn-shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0C5A44" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="480" height="360" rx="22" fill="#FFFFFF" stroke="#E9E7DF" stroke-width="1.5"/>

  <path d="M20 42 Q20 20 42 20 H478 Q500 20 500 42 V92 H20 Z" fill="url(#eq-header)"/>
  <text x="44" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#173404">Sous-comptes</text>
  <text x="44" y="78" font-family="Arial, sans-serif" font-size="11" fill="#3B6D11">Gérez les accès de votre équipe</text>

  <g filter="url(#eq-btn-shadow)">
    <rect x="380" y="42" width="96" height="28" rx="14" fill="url(#eq-add-btn)"/>
  </g>
  <text x="428" y="61" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Ajouter</text>

  <g filter="url(#eq-card-shadow)">
    <rect x="44" y="112" width="432" height="90" rx="16" fill="#FFFFFF" stroke="#EDEBE3" stroke-width="1"/>
  </g>
  <circle cx="80" cy="157" r="24" fill="url(#eq-avatar-green)"/>
  <text x="80" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="118" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A18">Marius (Livreur)</text>
  <text x="118" y="168" font-family="Arial, sans-serif" font-size="11" fill="#888780">Créé le 15/06/2026</text>
  <rect x="118" y="176" width="88" height="20" rx="10" fill="#EEF2FE"/>
  <text x="162" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">Commandes</text>
  <rect x="212" y="176" width="80" height="20" rx="10" fill="#EEF2FE"/>
  <text x="252" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">Livraisons</text>

  <g filter="url(#eq-card-shadow)">
    <rect x="44" y="215" width="432" height="90" rx="16" fill="#FFFFFF" stroke="#EDEBE3" stroke-width="1"/>
  </g>
  <circle cx="80" cy="260" r="24" fill="url(#eq-avatar-blue)"/>
  <text x="80" y="266" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  <text x="118" y="253" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A18">Chantal (Caisse)</text>
  <text x="118" y="271" font-family="Arial, sans-serif" font-size="11" fill="#888780">Créé le 02/07/2026</text>
  <rect x="118" y="279" width="88" height="20" rx="10" fill="#EAF3EE"/>
  <text x="162" y="293" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#27500A" text-anchor="middle">Commandes</text>
  <rect x="212" y="279" width="76" height="20" rx="10" fill="#EAF3EE"/>
  <text x="250" y="293" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#27500A" text-anchor="middle">Produits</text>

  <rect x="44" y="322" width="432" height="38" rx="14" fill="#F2F7FB"/>
  <text x="260" y="346" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle">2 sous-comptes actifs sur votre commerce</text>
