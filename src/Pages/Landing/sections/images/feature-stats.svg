<svg width="520" height="400" viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="st-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A73F5"/>
      <stop offset="100%" stop-color="#2246C9"/>
    </linearGradient>
    <linearGradient id="st-period-active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D68F0"/>
      <stop offset="100%" stop-color="#2246C9"/>
    </linearGradient>
    <filter id="st-bar-shadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2246C9" flood-opacity="0.18"/>
    </filter>
    <filter id="st-chip-shadow" x="-30%" y="-40%" width="160%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A1A18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="480" height="360" rx="22" fill="#FFFFFF" stroke="#E9E7DF" stroke-width="1.5"/>

  <text x="44" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A18">Tableau de bord</text>

  <rect x="330" y="38" width="52" height="26" rx="13" fill="url(#st-period-active)"/>
  <text x="356" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mois</text>
  <rect x="386" y="38" width="60" height="26" rx="13" fill="#F1EFE8"/>
  <text x="416" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#5F5E5A" text-anchor="middle">Année</text>

  <line x1="44" y1="80" x2="476" y2="80" stroke="#E9E7DF" stroke-width="1"/>

  <text x="44" y="112" font-family="Arial, sans-serif" font-size="11" fill="#888780">Chiffre d'affaires</text>
  <text x="44" y="142" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A18">11 200 000 F</text>

  <g filter="url(#st-chip-shadow)">
    <rect x="330" y="100" width="70" height="26" rx="13" fill="#EAF3EE"/>
  </g>
  <text x="365" y="117" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#27500A" text-anchor="middle">+18%</text>

  <g filter="url(#st-bar-shadow)">
    <rect x="60" y="290" width="46" height="45" rx="8" fill="url(#st-bar)" opacity="0.5"/>
    <rect x="120" y="255" width="46" height="80" rx="8" fill="url(#st-bar)" opacity="0.65"/>
    <rect x="180" y="270" width="46" height="65" rx="8" fill="url(#st-bar)" opacity="0.55"/>
    <rect x="240" y="220" width="46" height="115" rx="8" fill="url(#st-bar)"/>
    <rect x="300" y="240" width="46" height="95" rx="8" fill="url(#st-bar)" opacity="0.75"/>
    <rect x="360" y="260" width="46" height="75" rx="8" fill="url(#st-bar)" opacity="0.6"/>
  </g>
  <text x="83" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Lun</text>
  <text x="143" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Mar</text>
  <text x="203" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Mer</text>
  <text x="263" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Jeu</text>
  <text x="323" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Ven</text>
  <text x="383" y="352" font-family="Arial, sans-serif" font-size="10" fill="#888780" text-anchor="middle">Sam</text>
</svg>
